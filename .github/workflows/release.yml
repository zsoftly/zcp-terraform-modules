name: Release

on:
  push:
    tags: ["v[0-9]*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TF_VERSION: "1.12.2"

jobs:
  validate:
    name: 1. Validate (${{ matrix.example }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example:
          - demo-stack
          - test-images-templates
    steps:
      - uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Terraform formatting
        run: |
          terraform fmt -recursive -check . || (echo "Run: make fmt"; exit 1)

      - name: Check Markdown formatting
        run: npx --yes prettier@3 --check --log-level warn "**/*.md"

      - name: terraform init
        run: terraform -chdir=examples/${{ matrix.example }} init -backend=false -input=false -no-color

      - name: terraform validate
        run: terraform -chdir=examples/${{ matrix.example }} validate -no-color

  release:
    name: 2. Create Release
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
