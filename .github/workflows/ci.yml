name: CI

on:
  pull_request:
    branches: [main, "release/*"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TF_VERSION: "1.12.2"

jobs:
  changes:
    name: 1. Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            terraform:
              - '**/*.tf'
              - '**/*.tfvars.example'
              - '**/*.tftpl'
              - 'GNUmakefile'
            docs:
              - '**/*.md'

  lint:
    name: 2. Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terraform == 'true' || needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Terraform formatting
        run: |
          terraform fmt -recursive -check . || (echo "Run: make fmt"; exit 1)

      - name: Check Markdown formatting
        run: npx --yes prettier@3 --check --log-level warn "**/*.md"

  validate:
    name: 3. Validate (${{ matrix.example }})
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.terraform == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        example:
          - demo-stack
          - test-images-templates
    steps:
      - uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: terraform -chdir=examples/${{ matrix.example }} init -backend=false -input=false -no-color

      - name: terraform validate
        run: terraform -chdir=examples/${{ matrix.example }} validate -no-color
